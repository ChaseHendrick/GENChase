name: Technique
description: Propose a simulation that belongs in the studio.
title: "[technique] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/SharpMeow/GENChase/blob/main/CONTRIBUTING.md) first, then [RESEARCH.md](https://github.com/SharpMeow/GENChase/blob/main/RESEARCH.md) and [TECHNIQUES.md](https://github.com/SharpMeow/GENChase/blob/main/TECHNIQUES.md). The live count is in `techniques.json`; do not cite an older number from a social card or a survey log.

        A tab has to be a real simulation that reprints, with a paper to credit. Do not propose a restyle of a tab that already exists. Existing equations keep their own names. A derived identity belongs in [IDENTITIES.md](https://github.com/SharpMeow/GENChase/blob/main/IDENTITIES.md), uniqueness-checked, with a plate whose check can miss. Search the literature for the closed form and the extremum first. Hendrick's Identity is that case.
  - type: textarea
    id: system
    attributes:
      label: The system
      description: The equation, the paper, the year. Why it is not already a tab.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: What the plate would measure
      description: A quantity theory predicts, from the field on screen, with an uncertainty. "It looks like the paper" is not a check. A check that cannot fail is not a check.
  - type: input
    id: prior
    attributes:
      label: Closest existing tab
      placeholder: kp, swift, tilings
  - type: textarea
    id: search
    attributes:
      label: What you searched
      description: Query, date, what loaded, what did not. Paste the RESEARCH.md log shape if you have it. A search that is not written down will be done again.
      placeholder: |
        query: "..."
        Opened:
        Blocked:
        Conclusion:
  - type: dropdown
    id: familiarity
    attributes:
      label: Familiarity bucket (a curator's call, not a measurement)
      options:
        - ubiquitous
        - common
        - occasional
        - rare
        - unseen
      default: 2
