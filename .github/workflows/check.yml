name: check

# The browser harness is the real verification, but a full sweep of the file takes hours on a
# software renderer, so running all of it on every push would mean nobody waits for it. Split it:
# the structural lint is instant and gates every push, and the browser jobs cover one technique from
# each architecture family, which is what catches a change to a shared factory.
#
# Before merging a change to a shared path (src/shared/, a family factory used by several tabs, the build or
# the shell), run the full sweep locally, in the background under an overall timeout (it takes hours):
#   timeout 10800 sh tools/checkall.sh dist/studio.html /tmp/all.log <every id printed by tools/lint.js>
# A change confined to named modules is swept by tools/check.js and tools/export.js for those tabs
# (owner's instruction, 2026-09-27: no command runs for hours when it does not need to).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit on a branch is worth testing. Without this, a branch under active development
# holds a runner for every commit it ever pushed: the browser jobs take ten to fifteen minutes each, so
# a handful of quick pushes queues more work than the account can run at once, and the newest run then
# fails in three seconds because no runner is free. That failure looks exactly like a broken lint, which
# is worse than useless, because it sends you hunting for a bug in the one job that is instant and fine.
# Pull requests validate feature branches; push validates main after merge. This avoids running the
# same feature commit twice. Superseding a run cancels it; manual runs remain available.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    name: offline distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install browser checks
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 axe-core@4.10.3
          npx playwright install --with-deps --only-shell chromium
      - name: Package and test extracted offline studio
        run: |
          python3 tools/package-release.py --version 0.0.0
          node tools/distribution-check.js tools/dist/release/GENChase-studio.zip
          python3 tools/release-assets.py --check

  pde-plan:
    name: PDE evidence coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_required: ${{ steps.scope.outputs.browser_required }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check exhaustive, disjoint evidence coverage
        run: |
          timeout 120 node tools/pde-ci-check.js
          timeout 120 node tools/ci-scope-check.js
      - name: Determine whether browser checks are required
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          timeout 30 node tools/ci-scope.js > "$RUNNER_TEMP/ci-scope.json"
          node -e 'const fs = require("node:fs"), s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ci-scope.json", "utf8")); if (typeof s.browserRequired !== "boolean") throw Error("Missing CI scope"); console.log(s.reason); fs.appendFileSync(process.env.GITHUB_OUTPUT, "browser_required=" + s.browserRequired + "\n");'
      - name: Plan independent evidence workers
        id: plan
        run: |
          pde_matrix=$(timeout 30 node tools/pde-ci.js --matrix)
          echo "matrix=$pde_matrix" >> "$GITHUB_OUTPUT"

  pde-workers:
    name: PDE evidence (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: pde-plan
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.pde-plan.outputs.matrix) }}
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install reviewed browser
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
      - name: Verify assigned numerical and print evidence
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: timeout 1080 node tools/pde-ci.js ${{ matrix.id }}

  # Keep the required check's original name. A skipped, cancelled or failed worker must fail it.
  pde-complete:
    name: complete PDE fields and prints
    runs-on: ubuntu-latest
    needs: [pde-plan, pde-workers]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Require every evidence worker to pass
        env:
          PLAN_RESULT: ${{ needs.pde-plan.result }}
          BROWSER_REQUIRED: ${{ needs.pde-plan.outputs.browser_required }}
          WORKERS_RESULT: ${{ needs.pde-workers.result }}
        run: |
          timeout 30 bash -c '
            if [[ "$PLAN_RESULT" != success || "$WORKERS_RESULT" != success ]]; then
              echo "PDE verification incomplete: plan=$PLAN_RESULT workers=$WORKERS_RESULT"
              exit 1
            fi
            if [[ "$BROWSER_REQUIRED" == false ]]; then
              echo "Documentation-only PR: PDE browser evidence is not applicable; coverage planning passed."
            else
              echo "All PDE verification workers passed."
            fi
          '

  lint:
    name: structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generated build and scientific coverage
        run: |
          npm test
          node tools/maxwell-search-check.js
          node tools/maxwell-robust.js --check
          node tools/molecular-memory.js --controls
          node tools/cahn-scaling.js --controls
          node tools/vortex-collapse-search.js --controls > /dev/null
          # A merged submission makes the ledger stale until the volunteer-results workflow refreshes it.
          node tools/compute-ledger.js --check || echo '::warning::COMPUTE.md is behind the recorded jobs; the volunteer-results workflow refreshes it after merge.'
          python3 tools/cahn-scaling.py --controls
          python3 tools/release-notes.py --self-test
          node tools/build.js --check
          node tools/science.js
          node tools/talbot-science.js
          node tools/geometry-science.js
          node tools/breather-science.js
          node tools/peakon-science.js
          node tools/material-wave-science.js
          node tools/orbit-science.js
          node tools/lump-science.js
          node tools/chain-science.js
          node tools/rigid-body-audit.js
          node tools/direct-gravity-science.js
          node tools/physarum3d-display-check.js
          node tools/print-smoothing-check.js
          node tools/bec-neighbors-check.js
          node tools/vortex-kernel-check.js
          node tools/three-vortex-custom-check.js
          npm run test:validator
      - name: Structural checks
        run: node tools/lint.js
      - name: Polygon bounds and numerical controls
        run: |
          node tools/double-triangle-check.js
          node tools/polygon-collapse-check.js

  chrome:
    name: shell chrome
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 15
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      - name: Cahn-Hilliard GPU numerical benchmark
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: |
          node tools/pde-science.js
          node tools/pde-convergence.js
          node tools/pde-stability.js
      - name: Reaction-diffusion family GPU benchmarks
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/rdx-science.js
      - name: Reuleaux geometry and actual print preservation
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/reuleaux-science.js
      - name: PDE print exports preserve numerical state
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/pde-print-state.js
      - name: Seed box, hash, shortcuts, dock, formula chooser
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: |
          node tools/ui.js
          node tools/formula-chooser-check.js
      - name: Folder loading, recipes, witness and recovery
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: |
          node tools/folder-browser.js
          node tools/engine-api-check.js
          node tools/colophon-check.js
          node tools/reports-check.js
          node tools/art-only-check.js
          node tools/direct-gravity-browser.js
          node tools/bec-preview-check.js
      - name: Provenance in every export, research data and the status badge
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/provenance-check.js
      - name: Talbot carpet export preserves the plate
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/talbot-print-state.js
      - name: Fisher-KPP data export metadata
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/fisher-kpp-metadata-check.js

  volunteer-ui:
    name: volunteer and navigation (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install browser engine
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 axe-core@4.10.3
          # The validator checks chromium.executablePath() before starting witness jobs.
          # Keep the full binary here even though the browser itself runs headlessly.
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Navigation and local app lifecycle
        if: needs.pde-plan.outputs.browser_required != 'false'
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node tools/studio-navigation-check.js
          node tools/print-smoothing-browser.js
          node tools/validator-ui-check.js
      - name: Validator usability and accessibility
        if: needs.pde-plan.outputs.browser_required != 'false' && (matrix.browser == 'chromium')
        run: node tools/validator-ux-check.js
      - name: Witness corpus and deliberate misses
        if: needs.pde-plan.outputs.browser_required != 'false' && (matrix.browser == 'chromium')
        run: |
          node tools/harvest-browser-check.js
          node tools/validator-process-check.js

  art:
    name: art modes (hunt, deep render, evolve)
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install the validator's browser
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
      # Small grids on the software renderer: verified step counts, the engine's own hash and print path,
      # repeatable metrics on one renderer, resume, refusals, the flat gate and tab eligibility.
      - name: Art modes end to end
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/art-check.js

  complete-reviews:
    name: completed numerical and print reviews
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install reviewed browser
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps --only-shell chromium
      - name: Independent complete fields, trajectories and actual exports
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/verify.js --print three-vortex-bound parallelogram-lock quincunx-lock double-triangle-bound cgl vortex hopf apollonian weierstrass rogue soliton breather gyroid devil surfaces peakon neural-mass phyllotaxis ust lump fput

  wave-science:
    name: wave science
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      - name: Numerical benchmarks and shared print-state checks
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/verify.js --print schrodinger convection

  particle-field-science:
    name: particle and field science
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      - name: Independent benchmarks and print-state checks
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: |
          node tools/verify.js --print maxwell molecular
          node tools/volume-wave-science.js
          node tools/cgl-kernel-check.js

  recipes:
    name: recipe compatibility
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      # Every `legacy:` declaration in studio.html becomes five assertions, so a default that moves
      # without declaring what it used to be fails here rather than silently rewriting old plates.
      - name: Older recipes still reprint
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/recipe.js

  plates:
    name: plates (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One per architecture family: the shared GPU pde factory, the multi-species reaction
        # factory, the waves block, a CPU lattice, vector line work, a CPU density map, a raymarch,
        # a continuous cellular automaton, an exact closed-form field (no integrator), and the
        # identity plate whose check must fail off Gröbli's L=0 circle.
        id: [cahn, turing, schrodinger, ising, tilings, attractors, fractal, life, kp, three-vortex-bound, maxwell, molecular, tennis]
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      - name: Plate check
        if: needs.pde-plan.outputs.browser_required != 'false'
        # 25 s rather than 12: the default grids are 512 on the field families now, and on a software
        # renderer a 12 s budget judged every preset at about a quarter of its warm-up.
        run: node tools/check.js ${{ matrix.id }} 25000

  prints:
    name: print export (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: [lint, pde-plan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Exercise each actual print path. Grid fields retain their numerical resolution;
        # vector and analytic techniques can render at the requested output resolution.
        # One raster technique, one vector technique, and the identity plate (SVG spirals).
        id: [cahn, tilings, three-vortex-bound, maxwell, molecular, tennis]
    steps:
      - name: Documentation-only change
        if: needs.pde-plan.outputs.browser_required == 'false'
        run: echo 'Browser checks are not applicable to this documentation-only PR. Structural and distribution checks still run.'
      - uses: actions/checkout@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
      - uses: actions/setup-node@v5
        if: needs.pde-plan.outputs.browser_required != 'false'
        with:
          node-version: '22'
      - name: Install Chromium
        if: needs.pde-plan.outputs.browser_required != 'false'
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps --only-shell chromium
      - name: Export at 8 in, 300 ppi
        if: needs.pde-plan.outputs.browser_required != 'false'
        run: node tools/export.js ${{ matrix.id }} 8 300 8000 240000

  native-science:
    name: native CPU science
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python tools/heavy-runner-check.py

  print-production:
    name: print production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: python -m pip install -r tools/requirements-prepress.txt
      - run: node tools/print-formats-check.js /tmp/genchase-print-check
      - name: Independent readers and native PDF/X conversion
        run: python tools/print-formats-check.py /tmp/genchase-print-check /usr/share/color/icc/ghostscript/default_cmyk.icc
