name: cardiac isolated acceptance pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cardiac-acceptance.yml'
      - '.github/scripts/cardiac-stability-acceptance-pilot.py'
      - 'research/cardiac-cycle-certificates/**'

permissions:
  contents: read

concurrency:
  group: cardiac-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  isolated-piece:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cardiac controls]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and record the same pinned Linux arithmetic runtime
        timeout-minutes: 4
        run: |
          set -o pipefail
          mkdir -p work/wheels
          git rev-parse HEAD > work/runtime.txt
          timeout 180 python -m pip download --only-binary=:all: --no-deps python-flint==0.9.0 -d work/wheels
          echo '376b88cacd30612479e839ffdba887599d3f9c8c0e214852bf80bb2b194e4d76  work/wheels/python_flint-0.9.0-cp310-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl' | sha256sum -c -
          timeout 180 python -m pip install work/wheels/*.whl numpy==2.4.6 scipy==1.17.1 mpmath==1.3.0
          python -m pip freeze >> work/runtime.txt
          uname -a >> work/runtime.txt
          python -c 'import os; print("hardware_cpu_count", os.cpu_count()); print("cpu_affinity", sorted(os.sched_getaffinity(0)))' >> work/runtime.txt
          sha256sum work/wheels/*.whl >> work/runtime.txt
      - name: Run the existing fifteen native arithmetic and model controls
        run: |
          set -o pipefail
          timeout 30 python research/cardiac-cycle-certificates/fourier/test_arbmodel.py -k test_flint_pinned --wheel work/wheels/python_flint-0.9.0-cp310-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl 2>&1 | tee work/wheel-check.log
          # CAPD comparison binary is unavailable; these are the existing native controls.
          for control in test_generated_file test_decimal_and_scale_balls test_scales_and_params_match_capd test_a_ test_c_ test_d_ test_ring_ test_damping_symbol test_domain_and_parameter_interval; do
            timeout 60 python research/cardiac-cycle-certificates/fourier/test_arbmodel.py -k "$control" 2>&1 | tee -a work/model-controls.log
          done
      - name: Check isolated orchestration safeguards
        run: timeout 30 python .github/scripts/cardiac-stability-acceptance-pilot.py --self-test
      - name: Compute isolated G0P0 and run existing piece acceptance controls
        timeout-minutes: 11
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 610s /usr/bin/time -v python .github/scripts/cardiac-stability-acceptance-pilot.py --budget 600 --out work/pilot 2>&1 | tee work/pilot.log
      - name: Preserve actual outcome, raw fixture and runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardiac-stability-G0P0-acceptance-pilot
          path: |
            work/pilot/
            work/pilot.log
            work/runtime.txt
            work/wheel-check.log
            work/model-controls.log
          if-no-files-found: error
          retention-days: 30
