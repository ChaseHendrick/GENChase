name: Publish offline studio
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v, for example 0.8.0 (with notes only, 0.7.1 also finds its old tag v0.7.1, and "all" rewrites every release that has a CHANGELOG section)
        required: true
        type: string
      notes_only:
        description: Only rewrite the notes of an existing release from CHANGELOG.md; nothing is built or replaced
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: genchase-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.notes_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify version and successful main checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/package-release.py --version "$RELEASE_VERSION" --check-version
          # Versions are written without a leading v since 2026-09-26 and the releases before then keep their
          # v tags, so a version is new only if neither spelling is a tag yet.
          for tag in "$RELEASE_VERSION" "v$RELEASE_VERSION"; do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::The tag $tag already exists, so $RELEASE_VERSION is released. Choose the next version."; exit 1
            fi
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" > /tmp/check-runs.json
          python3 -c 'import json,os; runs=json.load(open("/tmp/check-runs.json"))["workflow_runs"]; assert any(r["head_sha"]==os.environ["GITHUB_SHA"] and r["conclusion"]=="success" for r in runs), "This main commit needs a successful check workflow before publication"'

      - name: Install distribution test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Build and verify offline bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tools/build.js --check
          node tools/science.js
          node tools/lint.js
          node tools/verify-commitment.js --all
          python3 tools/package-release.py --version "$RELEASE_VERSION"
          node tools/distribution-check.js tools/dist/release/GENChase-studio.zip
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PAGES_URL: ${{ vars.PAGES == 'on' && 'https://chasehendrick.github.io/GENChase/start.html' || '' }}
        run: |
          # The notes are the version's CHANGELOG section; the script stops if there is none.
          python3 tools/release-notes.py --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" ${PAGES_URL:+--pages-url "$PAGES_URL"} --output /tmp/release-notes.md
          # The papers' PDFs, programs and data files: files only, and each asset name once (tools/release-assets.py).
          python3 tools/release-assets.py > /tmp/release-assets.txt
          mapfile -t paper_assets < /tmp/release-assets.txt
          gh release create "$RELEASE_VERSION" tools/dist/release/GENChase-studio.zip tools/dist/release/SHA256SUMS.txt "${paper_assets[@]}" --target "$GITHUB_SHA" --title "GENChase $RELEASE_VERSION" --notes-file /tmp/release-notes.md --latest
  notes:
    # Rewrites the notes of releases that already exist, from the CHANGELOG on main. The tag, the
    # assets and the publication date stay as they were; the notes keep the commit each was built from.
    if: github.ref == 'refs/heads/main' && inputs.notes_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rewrite release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PAGES_URL: ${{ vars.PAGES == 'on' && 'https://chasehendrick.github.io/GENChase/start.html' || '' }}
        run: |
          if [ "$RELEASE_VERSION" = all ]; then tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName'); else tags=$RELEASE_VERSION; fi
          for tag in $tags; do
            # The releases made before 2026-09-26 keep their tags with a leading v (v0.7.1), while CHANGELOG.md
            # writes every version without one (## 0.7.1), so a version given plain finds its old tag.
            if ! gh release view "$tag" >/dev/null 2>&1 && gh release view "v${tag#v}" >/dev/null 2>&1; then tag=v${tag#v}; fi
            version=${tag#v}
            if ! grep -q "^## v\{0,1\}$version\( \|$\)" CHANGELOG.md; then echo "::warning::CHANGELOG.md has no section for $version, so the notes of $tag stay as they are."; continue; fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            date=$(gh release view "$tag" --json publishedAt --jq '.publishedAt[0:10]')
            pdfs=$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".pdf"))] | length')
            flag=; [ "$pdfs" -gt 0 ] || flag=--no-papers
            python3 tools/release-notes.py --existing --version "$tag" --sha "$sha" --repo "$GITHUB_REPOSITORY" --date "$date" $flag ${PAGES_URL:+--pages-url "$PAGES_URL"} --output /tmp/notes.md
            gh release edit "$tag" --notes-file /tmp/notes.md
            echo "Rewrote the notes of $tag from the section $version of CHANGELOG.md."
          done
