name: Publish offline studio
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.4.1 (with notes only, "all" rewrites every release that has a CHANGELOG section)
        required: true
        type: string
      notes_only:
        description: Only rewrite the notes of an existing release from CHANGELOG.md; nothing is built or replaced
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: genchase-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && !inputs.notes_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify version and successful main checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/package-release.py --version "$RELEASE_VERSION" --check-version
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" > /tmp/check-runs.json
          python3 -c 'import json,os; runs=json.load(open("/tmp/check-runs.json"))["workflow_runs"]; assert any(r["head_sha"]==os.environ["GITHUB_SHA"] and r["conclusion"]=="success" for r in runs), "This main commit needs a successful check workflow before publication"'

      - name: Install distribution test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Build and verify offline bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node tools/build.js --check
          node tools/science.js
          node tools/lint.js
          node tools/verify-commitment.js --all
          python3 tools/package-release.py --version "$RELEASE_VERSION"
          node tools/distribution-check.js tools/dist/release/GENChase-studio.zip
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PAGES_URL: ${{ vars.PAGES == 'on' && 'https://chasehendrick.github.io/GENChase/start.html' || '' }}
        run: |
          # The notes are the version's CHANGELOG section; the script stops if there is none.
          python3 tools/release-notes.py --version "$RELEASE_VERSION" --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" ${PAGES_URL:+--pages-url "$PAGES_URL"} --output /tmp/release-notes.md
          gh release create "$RELEASE_VERSION" tools/dist/release/GENChase-studio.zip tools/dist/release/SHA256SUMS.txt papers/*/paper/*.pdf papers/*/data/* papers/*/code/*.py --target "$GITHUB_SHA" --title "GENChase $RELEASE_VERSION" --notes-file /tmp/release-notes.md --latest
  notes:
    # Rewrites the notes of releases that already exist, from the CHANGELOG on main. The tag, the
    # assets and the publication date stay as they were; the notes keep the commit each was built from.
    if: github.ref == 'refs/heads/main' && inputs.notes_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rewrite release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PAGES_URL: ${{ vars.PAGES == 'on' && 'https://chasehendrick.github.io/GENChase/start.html' || '' }}
        run: |
          if [ "$RELEASE_VERSION" = all ]; then versions=$(gh release list --limit 100 --json tagName --jq '.[].tagName'); else versions=$RELEASE_VERSION; fi
          for v in $versions; do
            if ! grep -q "^## $v\( \|$\)" CHANGELOG.md; then echo "::warning::CHANGELOG.md has no section for $v, so its notes stay as they are."; continue; fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$v" --jq .sha)
            date=$(gh release view "$v" --json publishedAt --jq '.publishedAt[0:10]')
            pdfs=$(gh release view "$v" --json assets --jq '[.assets[].name | select(endswith(".pdf"))] | length')
            flag=; [ "$pdfs" -gt 0 ] || flag=--no-papers
            python3 tools/release-notes.py --version "$v" --sha "$sha" --repo "$GITHUB_REPOSITORY" --date "$date" $flag ${PAGES_URL:+--pages-url "$PAGES_URL"} --output /tmp/notes.md
            gh release edit "$v" --notes-file /tmp/notes.md
            echo "Rewrote the notes of $v from CHANGELOG.md."
          done
