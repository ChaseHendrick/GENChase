name: publish papers

# Publishes every paper that papers/papers.json marks "ready" or later as a public repository of its
# own (its companion) and locks that repository so only its owner can change it. Monthly runs renew the
# lock. It does nothing until the PAPERS_TOKEN secret exists; docs/PUBLISHING-PAPERS.md, section 1.

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'LICENSE'
      - 'tools/paper-sync.js'
      - 'tools/paper-publish.sh'
      - 'tools/paper-pull.sh'
      - '.github/workflows/papers.yml'
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      paper:
        description: Paper id (empty publishes every ready paper)
        required: false
        default: ''
      release:
        description: Also make this release in the paper's companion, for a Zenodo DOI (for example 1.0.0, without a leading v; an older release keeps its v tag)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the papers
        run: node tools/paper-check.js
      - name: Publish and lock the companion repositories
        env:
          GH_TOKEN: ${{ secrets.PAPERS_TOKEN }}
          PAPER: ${{ inputs.paper }}
          RELEASE: ${{ inputs.release }}
        run: sh tools/paper-publish.sh
