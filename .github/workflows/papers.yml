name: publish papers

# Publishes every paper that papers/papers.json marks "ready" or later as a public repository of its
# own (its companion) and locks that repository so only its owner can change it. Monthly runs renew the
# lock. It does nothing until the PAPERS_TOKEN secret exists; docs/PUBLISHING-PAPERS.md, section 1.

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'LICENSE'
      - 'tools/paper-sync.js'
      - 'tools/paper-publish.sh'
      - 'tools/paper-archive-check.py'
      - 'tools/paper-archive-build.py'
      - 'tools/paper-pull.sh'
      - '.github/workflows/papers.yml'
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      paper:
        description: Paper id (empty publishes every ready paper)
        required: false
        default: ''
      release:
        description: Make a companion release with a branded paper ZIP; Zenodo uses a separate manual version-draft upload (plain version, for example 1.0.0)
        required: false
        default: ''
      zenodo_github_import_disabled:
        description: Confirm automatic Zenodo GitHub import is disabled for this future release; this workflow does not disable it
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check the papers
        run: node tools/paper-check.js
      - name: Publish and lock the companion repositories
        env:
          GH_TOKEN: ${{ secrets.PAPERS_TOKEN }}
          PAPER: ${{ inputs.paper }}
          RELEASE: ${{ inputs.release }}
          PAPER_ARCHIVE_MODE: manual-zenodo
          ZENODO_GITHUB_INTEGRATION_DISABLED: ${{ inputs.zenodo_github_import_disabled }}
        run: sh tools/paper-publish.sh
