name: volunteer results

# Volunteer result files are re-verified before a human reviews them, and the leaderboard and compute ledger are
# rebuilt after they merge. Only positions and circulations are trusted from a submission: the verifier re-projects,
# re-polishes and re-certifies every claimed minimum. It runs from the base branch, so a pull request cannot pass by
# editing the verifier it is checked with. Shared art results (validation/submissions/<job>/art/) get a structural
# check from the base branch too: recipe hashes, schema keys, step counts and plain JPEG thumbnails. Pixels are not
# compared, because renderers differ.

on:
  pull_request:
    paths: ['validation/submissions/**', 'experiments/results/vortex-collapse/**']
  push:
    branches: [main]
    paths: ['validation/submissions/**', 'experiments/results/vortex-collapse/**', 'tools/vortex-collapse-search.js', 'tools/compute-ledger.js', 'apps/validate/compute.js']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('volunteer-verify-{0}', github.ref) || 'volunteer-refresh' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Re-verify submitted vortex results
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          verifier="$RUNNER_TEMP/base/tools/vortex-collapse-search.js"; from='the base branch'
          if [ ! -f "$verifier" ]; then verifier=tools/vortex-collapse-search.js; from='this pull request, which introduces it'; fi
          # NUL-separated paths: a name with a space or a non-ASCII letter is neither split nor quoted.
          files=(); re='/vortex-(collapse|grow|threshold)-[^/]*\.json$'
          while IFS= read -r -d '' f; do
            if [[ $f =~ $re ]]; then
              if [[ ! -f $f || -L $f ]]; then echo "::error::A vortex result must be a regular JSON file: $f"; exit 1; fi
              files+=("$f")
            fi
          done < <(git diff -z --name-only --no-renames --diff-filter=AMT "$BASE"...HEAD -- validation/submissions experiments/results/vortex-collapse)
          # A base verifier older than threshold files cannot check them; use this pull request's for the transition only.
          if [ -f "$verifier" ] && ! grep -q "vortex-threshold" "$verifier"; then verifier=tools/vortex-collapse-search.js; from='this pull request, which adds threshold verification'; fi
          if [ ${#files[@]} -eq 0 ]; then echo 'No vortex result files changed.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          { echo "## Vortex results re-verified with the verifier from $from"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set +e
          node "$verifier" --verify "${files[@]}" --strict > "$RUNNER_TEMP/verify.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/verify.log"; cat "$RUNNER_TEMP/verify.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Check submitted art results structurally
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          [ -d "$RUNNER_TEMP/base" ] || git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          checker="$RUNNER_TEMP/base/tools/art-submission-check.js"; from='the base branch'
          if [ ! -f "$checker" ]; then checker=tools/art-submission-check.js; from='this pull request, which introduces it'; fi
          # The checker lists every change under validation/submissions itself (git diff -z, all change types),
          # so no path is split by the shell, and a job folder that is not a job ID fails.
          { echo "## Art results checked with the checker from $from"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set +e
          node "$checker" --base "$BASE" > "$RUNNER_TEMP/art.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/art.log"; cat "$RUNNER_TEMP/art.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare the generated ledger branch
        run: |
          node tools/automation-branch.js prepare volunteer
      - name: Rebuild the leaderboard and compute ledger
        run: |
          node tools/vortex-collapse-search.js --refresh
          node tools/compute-ledger.js
      - name: Open or update a refresh pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          branch=automation/refresh-volunteer-ledger
          result=$(node tools/automation-branch.js finish volunteer)
          if [ "$result" = unchanged ] || [ "$result" = empty ]; then echo 'No new nonempty leaderboard or ledger proposal update to check.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main --title 'Refresh the vortex leaderboard and compute ledger' \
              --body 'Regenerated by the volunteer-results workflow after merged submissions: `node tools/vortex-collapse-search.js --refresh` and `node tools/compute-ledger.js`. Every leaderboard entry was re-verified from its positions and circulations. Check-trigger configuration is documented in docs/AUTOMATIONS.md.'
          elif [ "$result" = existing ]; then
            echo 'The existing proposal is unchanged; no new checks are needed.'
            exit 0
          fi
          if [[ "${HAS_AUTOMATION_TOKEN:-false}" == true ]]; then
            echo 'The repository-scoped automation token starts the normal pull_request checks.'
          else
            echo '::warning::AUTOMATION_TOKEN is absent. Dispatched checks verify this branch but do not satisfy required PR check contexts. For approval-required PR runs, select Approve workflows to run in the pull request to start the required checks. See docs/AUTOMATIONS.md.'
            gh workflow run check.yml --ref "$branch"
            gh workflow run pages.yml --ref "$branch"
          fi
          echo "Refresh pull request updated on $branch." >> "$GITHUB_STEP_SUMMARY"
