name: volunteer results

# Volunteer result files are re-verified before a human reviews them, and the leaderboard and compute ledger are
# rebuilt after they merge. Only positions and circulations are trusted from a submission: the verifier re-projects,
# re-polishes and re-certifies every claimed minimum. It runs from the base branch, so a pull request cannot pass by
# editing the verifier it is checked with. Shared art results (validation/submissions/<job>/art/) get a structural
# check from the base branch too: recipe hashes, schema keys, step counts and plain JPEG thumbnails. Pixels are not
# compared, because renderers differ.

on:
  pull_request:
    paths: ['validation/submissions/**', 'experiments/results/vortex-collapse/**']
  push:
    branches: [main]
    paths: ['validation/submissions/**', 'experiments/results/vortex-collapse/**', 'tools/vortex-collapse-search.js', 'tools/compute-ledger.js']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-verify submitted vortex results
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          verifier="$RUNNER_TEMP/base/tools/vortex-collapse-search.js"; from='the base branch'
          if [ ! -f "$verifier" ]; then verifier=tools/vortex-collapse-search.js; from='this pull request, which introduces it'; fi
          files=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- validation/submissions experiments/results/vortex-collapse | grep -E '/vortex-(collapse|grow)-[^/]*\.json$' || true)
          if [ -z "$files" ]; then echo 'No vortex result files changed.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          { echo "## Vortex results re-verified with the verifier from $from"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set +e
          node "$verifier" --verify $files --strict > "$RUNNER_TEMP/verify.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/verify.log"; cat "$RUNNER_TEMP/verify.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Check submitted art results structurally
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          [ -d "$RUNNER_TEMP/base" ] || git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          checker="$RUNNER_TEMP/base/tools/art-submission-check.js"; from='the base branch'
          if [ ! -f "$checker" ]; then checker=tools/art-submission-check.js; from='this pull request, which introduces it'; fi
          files=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- validation/submissions | grep -E '^validation/submissions/[^/]+/art/' || true)
          if [ -z "$files" ]; then echo 'No art result files changed.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          { echo "## Art results checked with the checker from $from"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set +e
          node "$checker" $files > "$RUNNER_TEMP/art.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/art.log"; cat "$RUNNER_TEMP/art.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the leaderboard and compute ledger
        run: |
          node tools/vortex-collapse-search.js --refresh
          node tools/compute-ledger.js
      - name: Open or update a refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo 'Leaderboard and ledger are current.' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          branch=automation/refresh-volunteer-ledger
          git config user.name 'Chaos'
          git config user.email '326338179+SharpMeow@users.noreply.github.com'
          git switch -c "$branch"
          git add experiments/VORTEX-COLLAPSE.md experiments/results/vortex-collapse-leaderboard.json COMPUTE.md
          git commit -m 'Refresh the vortex leaderboard and compute ledger'
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main --title 'Refresh the vortex leaderboard and compute ledger' \
              --body 'Regenerated by the volunteer-results workflow after merged submissions: `node tools/vortex-collapse-search.js --refresh` and `node tools/compute-ledger.js`. Every leaderboard entry was re-verified from its positions and circulations. Pull requests opened with the workflow token do not start other workflows.'
          fi
          echo "Refresh pull request updated on $branch." >> "$GITHUB_STEP_SUMMARY"
